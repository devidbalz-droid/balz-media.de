<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balz Media | Hier entsteht etwas Großes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            /* Der edle, dunkle Farbverlauf */
            background: linear-gradient(-45deg, #111, #222, #000, #1a1a1a);
            background-size: 400% 400%;
            /* Animation läuft jetzt in 6 Sekunden statt 15 Sekunden durch -> Schneller! */
            animation: gradientBG 6s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            overflow-y: auto; /* Fix für den Mac-Zoom-Bug */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px; /* Begrenzt die Breite auf dem Desktop, damit es edel wirkt */
            margin: auto;
            /* Kein Kasten mehr: Hintergrund und Rahmen sind komplett entfernt */
            background: transparent;
            border: none;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: linear-gradient(45deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 400;
            color: #ccc;
            margin-bottom: 12px;
        }

        .divider {
            height: 2px;
            width: 40px;
            background: #fff;
            margin: 16px auto;
            opacity: 0.3;
        }

        p {
            font-size: 0.95rem;
            color: #888;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .contact-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease-in-out;
        }

        .contact-btn:hover {
            background: #cccccc;
            transform: translateY(-2px);
        }

        /* ANPASSUNG FÜR FLXIBLE SCREENS UND HANDY-QUERFORMAT */
        @media (max-height: 540px) or (max-width: 480px) {
            body {
                padding: 20px 10px;
            }
            .logo {
                font-size: 1.8rem;
                margin-bottom: 8px;
            }
            .status-badge {
                margin-bottom: 16px;
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            h1 {
                font-size: 1.3rem;
                margin-bottom: 8px;
            }
            .divider {
                margin: 12px auto;
            }
            p {
                font-size: 0.9rem;
                margin-bottom: 20px;
            }
            .contact-btn {
                padding: 10px 24px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Balz Media</div>
        <div class="status-badge">Website im Aufbau</div>
        
        <h1>Hier entsteht etwas Großes.</h1>
        <div class="divider"></div>
        <p>Wir arbeiten im Hintergrund unter Hochdruck an unserer neuen Präsenz. Bald findest du hier erstklassigen Video-Content und maßgeschneiderte Social-Media-Lösungen.</p>
        
        <a href="mailto:balz.media@web.de" class="contact-btn">Jetzt Kontakt aufnehmen</a>
    </div>

</body>
</html>
